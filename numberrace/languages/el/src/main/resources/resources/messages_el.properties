#LEVEL_DESC_1=Recommended age: approx. 3 years\n\nCompare groups of objects, range of 1-5. No speed limit, large distance between numbers.
#LEVEL_DESC_2=Recommended age: approx. 4 years\n\nCompare groups of objects, range 1-10. No speed limit, large distance between numbers.
#LEVEL_DESC_3=Recommended age: approx. 5 years\n\nCompare spoken and written numbers introduced for 1-5, groups of objects still present. No speed limit. Large distance between numbers.
#LEVEL_DESC_4=Recommended age: approx. 5\u03a9 years\n\nCompare spoken and written numbers introduced for 1-10, groups of objects still present. Slow speed limit. Large distance between numbers.
#LEVEL_DESC_5=Recommended age: approx. 6 years\n\nCompare spoken and written numbers, groups of objects fade slowly. Slow speed limit. Medium distance between numbers.
#LEVEL_DESC_6=Recommended age: approx. 6\u03a9 years\n\nCompare spoken and written numbers, groups of objects fade fast. Slow speed limit. Medium distance between numbers.
#LEVEL_DESC_7=Recommended age: approx. 6\u03a9 years\n\nCompare verbal and written numbers only. Slow speed limit. Medium distance between numbers.
#LEVEL_DESC_8=Recommended age: approx. 7 years\n\nCompare written numbers only. Medium speed limit and distance between numbers.
#LEVEL_DESC_9=Recommended age: approx. 7 years\n\nCompare written numbers. Medium speed limit and distance between numbers. Strategic choice required (may sometimes win by choosing smaller number, due to hazards on playing board).
#LEVEL_DESC_10=Recommended age: approx. 7\u03a9 years\n\nCompare written numbers, need to calculate a small addition sum (up to 5). Medium speed limit. Small distance between numbers. Strategic choice required.
#LEVEL_DESC_11=Recommended age: approx. 7\u03a9 years\n\nCompare written numbers, need to calculate a larger addition sum (up to 10). Fast speed limit. Small distance between numbers. Strategic choice required.
#LEVEL_DESC_12=Recommended age: approx. 8 years\n\nCompare written numbers, need to calculate a small subtraction sum (up to 5). Fast speed limit. Small distance between numbers. Strategic choice required.
#LEVEL_DESC_13=Recommended age: approx. 8\u03a9 years\n\nCompare written numbers, need to calculate a larger subtraction sum (up to 10). Fast speed limit. Small distance between numbers. Strategic choice required.
#LEVEL_DESC_14=Recommended age: approx. 9+ years\n\nCompare written numbers, need to calculate both an addition and a subtraction sum (up to 10). Fast speed limit. Small distance between numbers. Strategic choice required.
